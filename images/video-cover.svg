<?xml version="1.0" encoding="UTF-8"?>
<!-- Poster shown on the presentation video before it plays.
     Replace videos/company-presentation.mp4 with the real video and,
     optionally, replace this poster (see the VIDEO section in index.html). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="vc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b6d"/>
      <stop offset="1" stop-color="#0c2748"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#vc)"/>
  <g opacity="0.12" stroke="#ffffff" stroke-width="2" fill="none">
    <circle cx="640" cy="360" r="300"/>
    <ellipse cx="640" cy="360" rx="130" ry="300"/>
    <ellipse cx="640" cy="360" rx="280" ry="120"/>
    <line x1="340" y1="360" x2="940" y2="360"/>
  </g>
  <circle cx="640" cy="360" r="70" fill="#c62828"/>
  <path d="M620 328 l52 32 -52 32 z" fill="#ffffff"/>
  <text x="640" y="520" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#ffffff">VST Translation</text>
  <text x="640" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#c9d6ea" letter-spacing="2">Company Presentation</text>
</svg>
