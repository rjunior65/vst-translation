<?xml version="1.0" encoding="UTF-8"?>
<!--
  Generic image placeholder. It is shown automatically wherever a real
  photo has not been added yet (tourism, gallery, team, services...).
  You do NOT need to edit HTML: just drop a real image with the expected
  filename into the matching folder and it will replace this automatically.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#eef2f8"/>
  <rect x="1" y="1" width="798" height="598" fill="none" stroke="#c9d6ea" stroke-width="2"/>
  <g transform="translate(400 270)" fill="none" stroke="#9fb2ce" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <rect x="-90" y="-60" width="180" height="130" rx="10"/>
    <circle cx="0" cy="5" r="34"/>
    <path d="M-60 -60 l18 -26 h84 l18 26"/>
  </g>
  <text x="400" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#6b7f9e" letter-spacing="2">VST TRANSLATION</text>
  <text x="400" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#9fb2ce">Add your photo here</text>
</svg>
