<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found — VST</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <style>
    :root{--blue:#123b6d;--navy:#0c2748;--red:#c62828}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
      font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;
      background:linear-gradient(160deg,var(--blue),var(--navy));padding:24px}
    .box{max-width:520px}
    img{height:64px;background:#fff;padding:8px 12px;border-radius:12px;margin-bottom:1.4rem}
    h1{font-family:Georgia,serif;font-size:clamp(2.6rem,10vw,4rem);margin:0}
    p{color:#cdd9ec;font-size:1.1rem;margin:.6rem 0 1.6rem}
    a{display:inline-block;background:var(--red);color:#fff;text-decoration:none;font-weight:700;
      padding:.85rem 1.8rem;border-radius:999px}
    a:hover{background:#9e1f1f}
  </style>
</head>
<body>
  <div class="box">
    <img src="images/logo/vst-logo.png" alt="VST" onerror="this.style.display='none'" />
    <h1>404</h1>
    <p>Sorry, this page was not found.</p>
    <a href="index.html">Back to home</a>
  </div>
</body>
</html>
